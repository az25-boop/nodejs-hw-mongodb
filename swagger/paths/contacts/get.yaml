tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get a filtered, paginated, and sorted list of contacts.'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter by whether the contact is marked as favourite.
    example: true
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter by contact type.
    example: 'work'
  - in: query
    name: page
    schema:
      type: integer
    description: Page number for pagination.
    example: 1
  - in: query
    name: perPage
    schema:
      type: integer
    description: Number of items per page.
    example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [name, email, isFavourite]
    description: Field by which to sort the contacts.
    example: 'name'
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['ASC', 'DESC']
    description: Order to sort the contacts (ascending or descending).
    example: 'ASC'
responses:
  '200':
    description: Successfully get a filtered, paginated, and sorted list of contacts.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 1
                totalPages:
                  type: number
                  example: 2
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '409':
    $ref: '../../components/responses/409.yaml'
