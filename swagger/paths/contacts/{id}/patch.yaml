tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: 'Update a contact with payload by id'
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: ID of the contact to update
    schema:
      type: string
requestBody:
  description: Fields to update in the contact
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Katya Pavlenko'
          phoneNumber:
            description: "Contact's number"
            type: string
            example: +380000000000
          email:
            description: "Contact's age"
            type: string
            example: katya@example.com
          isFavorite:
            description: 'Is this your favorite contact?'
            type: boolean
            example: true
          contactType:
            description: 'Type of phone number'
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
            default: null
responses:
  '200':
    description: Update a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  # '409':
  #   $ref: '../../../components/responses/409.yaml'
