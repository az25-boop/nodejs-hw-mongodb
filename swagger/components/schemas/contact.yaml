type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 676550095db2e33ea012565d
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: number
    example: 380960000000
  email:
    description: "Contact's email address"
    type: string
    example: john.doe@example.com
  isFavorite:
    description: 'Indicates if the contact is a favourite'
    type: boolean
    example: true
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
  photo:
    description: "URL of the contact's photo"
    type: string
    example: 'https://res.cloudinary.com/uqwgdu/image/upload/image.png'
  userId:
    description: "User's ID associated with this contact"
    type: string
    example: 67654feb5db2e33ea0125651
