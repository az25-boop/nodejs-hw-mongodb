type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's ID"
    type: string
    example: 676443ca2bdd47207b441b5c
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+123113355'
  email:
    description: "Contact's email address"
    type: string
    format: email
    example: 'john.doe@example.com'
  isFavourite:
    description: 'Indicates if the contact is a favourite'
    type: boolean
    example: true
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    example: 'personal'
  userId:
    description: "User's ID associated with this contact"
    type: string
    example: 676443ca2bdd47207b441b5c
  photo:
    description: "URL of the contact's photo"
    type: string
    format: uri
    example: 'https://res.cloudinary.com/uqwgdu/image/upload/image.png'
